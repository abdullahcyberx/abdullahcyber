<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Portfolio Manager</title>
  <style>
    :root {
      --bg: #070815; --surface: #12142B; --text: #E0E2F3; --muted: #8A8DAB;
      --primary: #4F65F1; --primary-hover: #3b4ebd; --danger: #f14f4f;
      --border: #2A2D53;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
    aside { width: 250px; background: var(--surface); border-right: 1px solid var(--border); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; }
    aside h2 { font-size: 1.1rem; margin: 0 0 1rem 0; color: #fff; }
    aside button { background: none; border: none; color: var(--text); text-align: left; padding: 0.5rem; cursor: pointer; border-radius: 4px; }
    aside button:hover, aside button.active { background: var(--border); }
    main { flex: 1; padding: 2rem; overflow-y: auto; position: relative; }
    h1 { margin-top: 0; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.9rem; color: var(--muted); }
    input, textarea, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 4px; font-family: inherit; width: 100%; }
    button.btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
    button.btn:hover { background: var(--primary-hover); }
    button.btn-danger { background: var(--danger); }
    button.btn-outline { background: transparent; border: 1px solid var(--border); }
    button.btn-outline:hover { background: var(--border); }
    button.btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
    .list-item { background: var(--surface); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
    .list-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .list-item-header h3 { margin: 0; font-size: 1.1rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .file-input { display: none; }
    .drag-area { border: 2px dashed var(--border); padding: 2rem; text-align: center; border-radius: 8px; margin-bottom: 2rem; cursor: pointer; }
    
    .editor-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); padding: 2rem; z-index: 10; display: none; flex-direction: column; }
    .editor-modal.active { display: flex; }
    .editor-scroll { flex: 1; overflow-y: auto; padding-right: 1rem; margin-bottom: 1rem; }
    .editor-footer { display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border); }
    
    .toolbar { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .badge { display: inline-block; padding: 0.2rem 0.4rem; background: var(--primary); font-size: 0.7rem; border-radius: 4px; margin-left: 0.5rem; }
    
    #unsaved-banner { display: none; background: #eab308; color: #000; padding: 0.5rem 1rem; text-align: center; position: absolute; top: 0; left: 0; right: 0; z-index: 20; font-weight: bold; }
  </style>
</head>
<body>
  <div id="unsaved-banner">You have unsaved changes. Remember to export!</div>
  
  <aside>
    <h2>Portfolio Manager</h2>
    <button class="tab-btn active" onclick="switchTab('import')">Import / Export</button>
    <button class="tab-btn" onclick="switchTab('profile')">Profile</button>
    <button class="tab-btn" onclick="switchTab('experience')">Experience</button>
    <button class="tab-btn" onclick="switchTab('projects')">Projects</button>
    <button class="tab-btn" onclick="switchTab('skills')">Skills</button>
    <button class="tab-btn" onclick="switchTab('certificates')">Certificates</button>
    <button class="tab-btn" onclick="switchTab('achievements')">Achievements</button>
    <button class="tab-btn" onclick="switchTab('education')">Education</button>
    <button class="tab-btn" onclick="switchTab('seo')">SEO</button>
    <button class="tab-btn" onclick="switchTab('ai')">AI Settings</button>
  </aside>
  
  <main>
    <div id="import" class="tab-content">
      <h1>Import / Export</h1>
      <p>Select your content files from the <code>content/</code> folder or drop them below.</p>
      <input type="file" id="file-input" class="file-input" multiple accept=".json" onchange="handleFiles(this.files)">
      <div class="drag-area" onclick="document.getElementById('file-input').click()">
        Click to select JSON files or Drag & Drop them here
      </div>
      <div class="actions">
        <button class="btn" onclick="exportBackup()">Download Combined Backup</button>
        <button class="btn" onclick="exportIndividual()">Download Individual JSONs</button>
        <button class="btn btn-outline" onclick="resetChanges()">Reset Unsaved Changes</button>
      </div>
      <pre id="loaded-status" style="margin-top:2rem;color:var(--muted);font-size:0.8rem;"></pre>
    </div>

    <!-- Dynamic Tabs will be rendered here -->
    <div id="dynamic-content"></div>

    <!-- Item Editor Modal -->
    <div id="item-editor" class="editor-modal">
      <h2 id="editor-title">Edit Item</h2>
      <div class="editor-scroll" id="editor-fields"></div>
      <div class="editor-footer">
        <button class="btn btn-outline" onclick="closeEditor()">Cancel</button>
        <button class="btn" onclick="saveEditor()">Save to Memory</button>
      </div>
    </div>
  </main>

  <script>
    const schemas = {
      profile: {
        type: 'object',
        fields: [
          { key: 'fullName', label: 'Full Name', type: 'text' },
          { key: 'professionalTitle', label: 'Professional Title', type: 'text' },
          { key: 'heroHeading', label: 'Hero Heading (Line 1)', type: 'text' },
          { key: 'heroAccent', label: 'Hero Accent (Line 2)', type: 'text' },
          { key: 'heroIntroduction', label: 'Hero Introduction', type: 'textarea' },
          { key: 'aboutText', label: 'About Text (Array of paragraphs)', type: 'array' },
          { key: 'location', label: 'Location', type: 'text' },
          { key: 'availabilityStatus', label: 'Availability', type: 'text' },
          { key: 'email', label: 'Email', type: 'text' },
          { key: 'githubUrl', label: 'GitHub URL', type: 'text' },
          { key: 'linkedinUrl', label: 'LinkedIn URL', type: 'text' },
          { key: 'cvPath', label: 'CV Path', type: 'text' },
          { key: 'ethicalDisclaimer', label: 'Ethical Disclaimer', type: 'textarea' }
        ]
      },
      experience: {
        type: 'array', titleKey: 'role', subtitleKey: 'company',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'company', label: 'Company', type: 'text' },
          { key: 'role', label: 'Role', type: 'text' },
          { key: 'location', label: 'Location', type: 'text' },
          { key: 'workType', label: 'Work Type', type: 'text' },
          { key: 'startDate', label: 'Start Date', type: 'text' },
          { key: 'endDate', label: 'End Date', type: 'text' },
          { key: 'currentStatus', label: 'Current Status', type: 'checkbox' },
          { key: 'description', label: 'Description', type: 'textarea' },
          { key: 'responsibilities', label: 'Responsibilities', type: 'array' },
          { key: 'displayOrder', label: 'Display Order', type: 'number' }
        ]
      },
      projects: {
        type: 'array', titleKey: 'title', subtitleKey: 'category',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'slug', label: 'Slug', type: 'text' },
          { key: 'title', label: 'Title', type: 'text' },
          { key: 'summary', label: 'Summary', type: 'textarea' },
          { key: 'category', label: 'Category', type: 'text' },
          { key: 'tools', label: 'Tools', type: 'array' },
          { key: 'image', label: 'Image Class', type: 'text' },
          { key: 'repositoryUrl', label: 'Repository URL', type: 'text' },
          { key: 'featured', label: 'Featured', type: 'checkbox' },
          { key: 'displayOrder', label: 'Display Order', type: 'number' }
        ]
      },
      skills: {
        type: 'array', titleKey: 'name', subtitleKey: 'category',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'name', label: 'Name', type: 'text' },
          { key: 'category', label: 'Category', type: 'text' },
          { key: 'icon', label: 'Icon Label', type: 'text' },
          { key: 'keyboardPosition', label: 'Keyboard Position', type: 'text' },
          { key: 'description', label: 'Description', type: 'textarea' },
          { key: 'proficiencyValue', label: 'Proficiency (0-100)', type: 'number' },
          { key: 'featured', label: 'Featured', type: 'checkbox' },
          { key: 'displayOrder', label: 'Display Order', type: 'number' },
          { key: 'skillKey', label: 'Skill Key', type: 'text' }
        ]
      },
      certificates: {
        type: 'array', titleKey: 'title', subtitleKey: 'issuer',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'slug', label: 'Slug', type: 'text' },
          { key: 'title', label: 'Title', type: 'text' },
          { key: 'issuer', label: 'Issuer', type: 'text' },
          { key: 'issueDate', label: 'Issue Date', type: 'text' },
          { key: 'credentialId', label: 'Credential ID', type: 'text' },
          { key: 'verificationUrl', label: 'Verification URL', type: 'text' },
          { key: 'certificateFile', label: 'Certificate File Path', type: 'text' },
          { key: 'icon', label: 'Icon Text (1-3 chars)', type: 'text' },
          { key: 'featured', label: 'Featured', type: 'checkbox' },
          { key: 'displayOrder', label: 'Display Order', type: 'number' }
        ]
      },
      achievements: {
        type: 'array', titleKey: 'title', subtitleKey: 'organization',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'title', label: 'Title', type: 'text' },
          { key: 'organization', label: 'Organization', type: 'text' },
          { key: 'date', label: 'Date', type: 'text' },
          { key: 'description', label: 'Description', type: 'text' },
          { key: 'displayOrder', label: 'Display Order', type: 'number' },
          { key: 'isBadge', label: 'Is Badge', type: 'checkbox' }
        ]
      },
      education: {
        type: 'array', titleKey: 'degree', subtitleKey: 'institution',
        fields: [
          { key: 'id', label: 'ID', type: 'text' },
          { key: 'institution', label: 'Institution', type: 'text' },
          { key: 'degree', label: 'Degree', type: 'text' },
          { key: 'expectedCompletion', label: 'Expected Completion', type: 'text' },
          { key: 'description', label: 'Description', type: 'textarea' }
        ]
      },
      seo: {
        type: 'object',
        fields: [
          { key: 'siteUrl', label: 'Site URL', type: 'text' },
          { key: 'canonicalUrl', label: 'Canonical URL', type: 'text' },
          { key: 'title', label: 'Meta Title', type: 'text' },
          { key: 'description', label: 'Meta Description', type: 'textarea' },
          { key: 'keywords', label: 'Keywords', type: 'textarea' }
        ]
      },
      ai: {
        type: 'object',
        fields: [
          { key: 'assistantName', label: 'Assistant Name', type: 'text' },
          { key: 'greeting', label: 'Greeting', type: 'text' },
          { key: 'fallbackAnswer', label: 'Fallback Answer', type: 'textarea' },
          { key: 'suggestedQuestions', label: 'Suggested Questions (Array)', type: 'array' },
          { key: 'privacyMessage', label: 'Privacy Message', type: 'textarea' }
        ]
      }
    };

    let contentStore = {};
    let initialStoreStr = "{}";
    let currentTab = 'import';
    let editingState = { tab: null, index: null, item: null };

    window.addEventListener('beforeunload', (e) => {
      if (checkUnsaved()) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function checkUnsaved() {
      const isUnsaved = JSON.stringify(contentStore) !== initialStoreStr && Object.keys(contentStore).length > 0;
      document.getElementById('unsaved-banner').style.display = isUnsaved ? 'block' : 'none';
      return isUnsaved;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const contentDiv = document.getElementById('dynamic-content');
      
      if (tabId === 'import') {
        document.getElementById('import').style.display = 'block';
        contentDiv.innerHTML = '';
      } else {
        renderTabContent(tabId);
      }
      
      event.target.classList.add('active');
      currentTab = tabId;
      document.getElementById('item-editor').classList.remove('active');
    }

    function handleFiles(files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            const key = file.name.replace('.json', '');
            if (key === 'portfolio-content-backup') {
              contentStore = { ...contentStore, ...data };
            } else if (schemas[key]) {
              contentStore[key] = data;
            }
            document.getElementById('loaded-status').innerText += `Loaded ${file.name}\n`;
            initialStoreStr = JSON.stringify(contentStore);
            checkUnsaved();
          } catch (err) {
            alert('Failed to parse ' + file.name);
          }
        };
        reader.readAsText(file);
      });
    }

    function triggerDownload(filename, text) {
      const el = document.createElement('a');
      el.setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(text));
      el.setAttribute('download', filename);
      el.style.display = 'none';
      document.body.appendChild(el);
      el.click();
      document.body.removeChild(el);
    }

    function exportBackup() {
      triggerDownload('portfolio-content-backup.json', JSON.stringify(contentStore, null, 2));
      initialStoreStr = JSON.stringify(contentStore);
      checkUnsaved();
    }

    function exportIndividual() {
      Object.keys(contentStore).forEach(key => {
        if(contentStore[key]) {
          triggerDownload(`${key}.json`, JSON.stringify(contentStore[key], null, 2));
        }
      });
      initialStoreStr = JSON.stringify(contentStore);
      checkUnsaved();
    }

    function resetChanges() {
      if(confirm('Reset all unsaved changes?')) {
        contentStore = JSON.parse(initialStoreStr);
        document.getElementById('loaded-status').innerText += "Changes reset to last save.\n";
        checkUnsaved();
      }
    }

    function escapeHtml(unsafe) {
      if(typeof unsafe !== 'string') return '';
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function renderTabContent(tab) {
      const schema = schemas[tab];
      const data = contentStore[tab];
      const container = document.getElementById('dynamic-content');
      container.innerHTML = '';
      
      if (!data) {
        const h1 = document.createElement('h1');
        h1.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);
        const p = document.createElement('p');
        p.textContent = 'No data loaded. Import JSON first.';
        container.appendChild(h1);
        container.appendChild(p);
        return;
      }

      if (schema.type === 'object') {
        const header = document.createElement('div');
        header.className = 'header-actions';
        const h1 = document.createElement('h1');
        h1.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);
        header.appendChild(h1);
        container.appendChild(header);

        const listItem = document.createElement('div');
        listItem.className = 'list-item';
        
        renderFields(schema.fields, data, tab, listItem);
        
        const saveDiv = document.createElement('div');
        saveDiv.style.marginTop = '1rem';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn';
        saveBtn.textContent = 'Save Changes';
        saveBtn.onclick = () => saveObject(tab);
        saveDiv.appendChild(saveBtn);
        listItem.appendChild(saveDiv);
        
        container.appendChild(listItem);
      } else if (schema.type === 'array') {
        const header = document.createElement('div');
        header.className = 'header-actions';
        const h1 = document.createElement('h1');
        h1.textContent = tab.charAt(0).toUpperCase() + tab.slice(1);
        const addBtn = document.createElement('button');
        addBtn.className = 'btn';
        addBtn.textContent = 'Add New';
        addBtn.onclick = () => openEditor(tab, null);
        header.appendChild(h1);
        header.appendChild(addBtn);
        container.appendChild(header);

        const toolbar = document.createElement('div');
        toolbar.className = 'toolbar';
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.id = `search-${tab}`;
        searchInput.placeholder = 'Search...';
        searchInput.style.width = '200px';
        searchInput.oninput = () => filterList(tab);
        toolbar.appendChild(searchInput);

        if (schema.fields.some(f => f.key === 'featured')) {
          const label = document.createElement('label');
          label.style.display = 'flex';
          label.style.alignItems = 'center';
          label.style.gap = '0.5rem';
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.id = `filter-feat-${tab}`;
          chk.onchange = () => filterList(tab);
          label.appendChild(chk);
          label.appendChild(document.createTextNode(' Featured only'));
          toolbar.appendChild(label);
        }
        container.appendChild(toolbar);

        const listContainer = document.createElement('div');
        listContainer.id = `list-container-${tab}`;
        container.appendChild(listContainer);

        renderListItems(tab);
      }
    }

    function renderListItems(tab) {
      const schema = schemas[tab];
      const data = contentStore[tab];
      const searchEl = document.getElementById(`search-${tab}`);
      const search = searchEl ? searchEl.value.toLowerCase() : '';
      const filterFeatEl = document.getElementById(`filter-feat-${tab}`);
      const filterFeat = filterFeatEl ? filterFeatEl.checked : false;
      
      const listContainer = document.getElementById(`list-container-${tab}`);
      if (!listContainer) return;
      listContainer.innerHTML = '';

      data.forEach((item, idx) => {
        const titleText = item[schema.titleKey] || item.id || `Item ${idx}`;
        const subtitleText = item[schema.subtitleKey] || '';
        const isFeatured = item.featured === true;
        
        if (filterFeat && !isFeatured) return;
        if (search && !titleText.toLowerCase().includes(search) && !subtitleText.toLowerCase().includes(search)) return;

        const div = document.createElement('div');
        div.className = 'list-item';
        
        const headerDiv = document.createElement('div');
        headerDiv.className = 'list-item-header';
        
        const titleDiv = document.createElement('div');
        const h3 = document.createElement('h3');
        h3.textContent = titleText + (isFeatured ? ' ' : '');
        if (isFeatured) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Featured';
          h3.appendChild(badge);
        }
        const subSpan = document.createElement('span');
        subSpan.style.color = 'var(--muted)';
        subSpan.style.fontSize = '0.9rem';
        subSpan.textContent = subtitleText;
        titleDiv.appendChild(h3);
        titleDiv.appendChild(subSpan);
        headerDiv.appendChild(titleDiv);

        const moveActions = document.createElement('div');
        moveActions.className = 'actions';
        const btnUp = document.createElement('button');
        btnUp.className = 'btn btn-sm';
        btnUp.textContent = '↑';
        btnUp.disabled = (idx === 0);
        btnUp.onclick = () => moveItem(tab, idx, -1);
        const btnDown = document.createElement('button');
        btnDown.className = 'btn btn-sm';
        btnDown.textContent = '↓';
        btnDown.disabled = (idx === data.length - 1);
        btnDown.onclick = () => moveItem(tab, idx, 1);
        moveActions.appendChild(btnUp);
        moveActions.appendChild(btnDown);
        headerDiv.appendChild(moveActions);
        div.appendChild(headerDiv);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';
        
        const btnEdit = document.createElement('button');
        btnEdit.className = 'btn btn-outline btn-sm';
        btnEdit.textContent = 'Edit';
        btnEdit.onclick = () => openEditor(tab, idx);
        actionsDiv.appendChild(btnEdit);
        
        const btnDup = document.createElement('button');
        btnDup.className = 'btn btn-outline btn-sm';
        btnDup.textContent = 'Duplicate';
        btnDup.onclick = () => duplicateItem(tab, idx);
        actionsDiv.appendChild(btnDup);

        if (schema.fields.some(f => f.key === 'featured')) {
          const btnFeat = document.createElement('button');
          btnFeat.className = 'btn btn-outline btn-sm';
          btnFeat.textContent = isFeatured ? 'Unfeature' : 'Feature';
          btnFeat.onclick = () => toggleFeatured(tab, idx);
          actionsDiv.appendChild(btnFeat);
        }

        const btnDel = document.createElement('button');
        btnDel.className = 'btn btn-danger btn-sm';
        btnDel.textContent = 'Delete';
        btnDel.onclick = () => deleteItem(tab, idx);
        actionsDiv.appendChild(btnDel);

        div.appendChild(actionsDiv);
        listContainer.appendChild(div);
      });
    }

    function filterList(tab) {
      renderListItems(tab);
    }

    function renderFields(fields, data, prefix, container) {
      fields.forEach(f => {
        const val = data[f.key] !== undefined ? data[f.key] : '';
        const id = `${prefix}-${f.key}`;
        
        const group = document.createElement('div');
        group.className = 'form-group';
        
        if (f.type === 'text' || f.type === 'number') {
          const label = document.createElement('label');
          label.textContent = f.label;
          const input = document.createElement('input');
          input.type = f.type;
          input.id = id;
          input.value = val;
          group.appendChild(label);
          group.appendChild(input);
        } else if (f.type === 'textarea') {
          const label = document.createElement('label');
          label.textContent = f.label;
          const input = document.createElement('textarea');
          input.id = id;
          input.rows = 4;
          input.value = val;
          group.appendChild(label);
          group.appendChild(input);
        } else if (f.type === 'checkbox') {
          group.style.flexDirection = 'row';
          group.style.alignItems = 'center';
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.id = id;
          input.checked = !!val;
          input.style.width = 'auto';
          const label = document.createElement('label');
          label.htmlFor = id;
          label.textContent = f.label;
          group.appendChild(input);
          group.appendChild(label);
        } else if (f.type === 'array') {
          const label = document.createElement('label');
          label.textContent = f.label + ' (One per line)';
          const input = document.createElement('textarea');
          input.id = id;
          input.rows = 4;
          input.value = Array.isArray(val) ? val.join('\n') : '';
          group.appendChild(label);
          group.appendChild(input);
        }
        
        container.appendChild(group);
      });
    }

    function saveObject(tab) {
      const schema = schemas[tab];
      schema.fields.forEach(f => {
        const el = document.getElementById(`${tab}-${f.key}`);
        if (f.type === 'checkbox') {
          contentStore[tab][f.key] = el.checked;
        } else if (f.type === 'number') {
          contentStore[tab][f.key] = Number(el.value);
        } else if (f.type === 'array') {
          contentStore[tab][f.key] = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
        } else {
          contentStore[tab][f.key] = el.value;
        }
      });
      checkUnsaved();
      alert('Saved to memory!');
    }

    function openEditor(tab, idx) {
      editingState = { tab, index: idx, item: idx !== null ? JSON.parse(JSON.stringify(contentStore[tab][idx])) : {} };
      document.getElementById('editor-title').textContent = idx !== null ? `Edit ${tab}` : `Add New ${tab}`;
      const fieldsContainer = document.getElementById('editor-fields');
      fieldsContainer.innerHTML = '';
      renderFields(schemas[tab].fields, editingState.item, 'edit', fieldsContainer);
      document.getElementById('item-editor').classList.add('active');
    }

    function closeEditor() {
      document.getElementById('item-editor').classList.remove('active');
      editingState = { tab: null, index: null, item: null };
    }

    function validateExtension(url) {
      if(!url) return true;
      const ext = url.split('.').pop().toLowerCase();
      return ['pdf', 'png', 'jpg', 'jpeg', 'webp', 'avif'].includes(ext);
    }
    
    function validateUrl(str) {
      if(!str) return true;
      try { new URL(str); return true; } catch(e) { return str.startsWith('/'); }
    }

    function saveEditor() {
      const tab = editingState.tab;
      const schema = schemas[tab];
      let newItem = {};
      
      let validationError = null;
      
      schema.fields.forEach(f => {
        const el = document.getElementById(`edit-${f.key}`);
        if (f.type === 'checkbox') {
          newItem[f.key] = el.checked;
        } else if (f.type === 'number') {
          newItem[f.key] = Number(el.value);
        } else if (f.type === 'array') {
          newItem[f.key] = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
        } else {
          newItem[f.key] = el.value;
          
          if (f.key === 'certificateFile' && el.value && !validateExtension(el.value)) {
            validationError = 'Invalid certificate extension. Allowed: pdf, png, jpg, jpeg, webp, avif';
          }
          if (f.key.toLowerCase().includes('url') && el.value && !validateUrl(el.value)) {
            validationError = 'Invalid URL format.';
          }
        }
      });
      
      if (validationError) {
        alert(validationError);
        return;
      }
      
      if (editingState.index !== null) {
        contentStore[tab][editingState.index] = newItem;
      } else {
        if (newItem.displayOrder === undefined) newItem.displayOrder = 99;
        if (!newItem.id) newItem.id = `new-${Date.now()}`;
        contentStore[tab].push(newItem);
      }
      
      // Sort if it has displayOrder
      if (schema.fields.some(f => f.key === 'displayOrder')) {
        contentStore[tab].sort((a,b) => (a.displayOrder || 99) - (b.displayOrder || 99));
      }
      
      closeEditor();
      renderListItems(tab);
      checkUnsaved();
    }

    function deleteItem(tab, idx) {
      if(confirm('Are you sure you want to delete this item?')) {
        contentStore[tab].splice(idx, 1);
        renderListItems(tab);
        checkUnsaved();
      }
    }
    
    function duplicateItem(tab, idx) {
      const clone = JSON.parse(JSON.stringify(contentStore[tab][idx]));
      clone.id = `${clone.id}-copy`;
      contentStore[tab].splice(idx + 1, 0, clone);
      renderListItems(tab);
      checkUnsaved();
    }
    
    function toggleFeatured(tab, idx) {
      contentStore[tab][idx].featured = !contentStore[tab][idx].featured;
      renderListItems(tab);
      checkUnsaved();
    }

    function moveItem(tab, idx, dir) {
      if (idx + dir < 0 || idx + dir >= contentStore[tab].length) return;
      
      // Swap display orders to keep them logical
      const currentOrder = contentStore[tab][idx].displayOrder || idx;
      const targetOrder = contentStore[tab][idx+dir].displayOrder || (idx+dir);
      
      contentStore[tab][idx].displayOrder = targetOrder;
      contentStore[tab][idx+dir].displayOrder = currentOrder;
      
      const temp = contentStore[tab][idx];
      contentStore[tab][idx] = contentStore[tab][idx+dir];
      contentStore[tab][idx+dir] = temp;
      
      renderListItems(tab);
      checkUnsaved();
    }
  </script>
</body>
</html>
